name: build

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -q forge.zip
      - name: Compilar y probar
        working-directory: forge
        run: |
          cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests -j4
          ctest --test-dir build-tests --output-on-failure

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        shell: pwsh
        run: Expand-Archive -Path forge.zip -DestinationPath .
      - name: Compilar runtime de Windows
        working-directory: forge
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: forge_runtime
          path: forge/build/Release/forge_runtime.exe

  android-apk:
    needs: [tests, windows-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -q forge.zip
      # El runtime de Windows viaja dentro del APK para exportar a .exe sin compilador.
      - uses: actions/download-artifact@v4
        with:
          name: forge_runtime
          path: forge/android/app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        run: gradle -p forge/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: forge-apk
          path: forge/android/app/build/outputs/apk/debug/*.apk
